plugins {
    id 'com.android.application'
    id 'com.google.gms.google-services'      // reads app/google-services.json
    id 'com.google.firebase.firebase-perf'   // auto HTTP + app start + screen rendering traces
    id 'com.google.firebase.appdistribution' // pushes Jenkins builds to field devices
}

// --- CI hooks --------------------------------------------------------------------
// Jenkins binds the "Secret file" credential to this env var; the file is never in Git.
def ciGoogleServices = System.getenv('GOOGLE_SERVICES_JSON')
if (ciGoogleServices) {
    file('google-services.json').bytes = new File(ciGoogleServices).bytes
}
def ciBuildNumber = (System.getenv('BUILD_NUMBER') ?: '1') as Integer
def ciBranch = System.getenv('BRANCH_NAME') ?: 'local'

android {
    namespace 'com.example.ecouganda'
    compileSdk 35
    defaultConfig {
        applicationId 'com.example.ecouganda'
        minSdk 23
        targetSdk 34
        versionCode ciBuildNumber
        versionName "1.0.${ciBuildNumber}"

        // Instrumented (device) tests - run locally, on Firebase Test Lab and from Jenkins
        testInstrumentationRunner 'androidx.test.runner.AndroidJUnitRunner'
        // Orchestrator + clearPackageData: every test starts from a clean app state
        testInstrumentationRunnerArguments clearPackageData: 'true'
    }

    buildFeatures {
        buildConfig true
    }

    buildTypes {
        debug {
            buildConfigField 'boolean', 'PERF_COLLECTION_ENABLED', 'true'
            firebaseAppDistribution {
                artifactType = 'APK'
                groups = 'field-volunteers, warehouse-tablets'
                releaseNotes = "Jenkins build ${ciBuildNumber} from ${ciBranch}"
                if (System.getenv('FIREBASE_APP_DIST_SA')) {
                    serviceCredentialsFile = System.getenv('FIREBASE_APP_DIST_SA')
                }
            }
        }
        release {
            minifyEnabled false
            buildConfigField 'boolean', 'PERF_COLLECTION_ENABLED', 'true'
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_11
        targetCompatibility JavaVersion.VERSION_11
    }

    lint {
        xmlReport true
        htmlReport true
        abortOnError false   // Jenkins Warnings NG quality gate decides pass/fail
    }

    testOptions {
        unitTests.returnDefaultValues = true
        execution 'ANDROIDX_TEST_ORCHESTRATOR'
        animationsDisabled = true
    }
}

dependencies {
    implementation 'androidx.appcompat:appcompat:1.6.1'
    implementation 'com.google.android.material:material:1.9.0'
    implementation 'androidx.core:core-splashscreen:1.2.0'
    implementation 'androidx.fragment:fragment:1.6.1'

    implementation platform('com.google.firebase:firebase-bom:34.14.1')
    implementation 'com.google.firebase:firebase-perf'
    implementation 'com.google.firebase:firebase-messaging'   // push notifications -> report deep link

    testImplementation 'junit:junit:4.13.2'

    // Device tests (src/androidTest): Espresso for UI, UI Automator for the notification shade
    androidTestImplementation 'androidx.test:runner:1.6.2'
    androidTestImplementation 'androidx.test:rules:1.6.1'
    androidTestImplementation 'androidx.test:core:1.6.1'
    androidTestImplementation 'androidx.test.ext:junit:1.2.1'
    androidTestImplementation 'androidx.test.espresso:espresso-core:3.6.1'
    androidTestImplementation 'androidx.test.uiautomator:uiautomator:2.3.0'
    androidTestUtil 'androidx.test:orchestrator:1.5.1'
}
