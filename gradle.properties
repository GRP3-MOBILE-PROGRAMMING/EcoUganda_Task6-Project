# Increase memory and force Java to use the Windows native certificate store
# This is the most effective fix for SunCertPathBuilderException on Windows.
org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8 -Djavax.net.ssl.trustStoreType=WINDOWS-ROOT

# System-wide SSL properties for the Gradle daemon
systemProp.javax.net.ssl.trustStoreType=WINDOWS-ROOT
systemProp.https.protocols=TLSv1.2,TLSv1.3

android.useAndroidX=true
