org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8
org.gradle.caching=true
android.useAndroidX=true

# The Windows-only SSL fix that used to live here
#   (-Djavax.net.ssl.trustStoreType=WINDOWS-ROOT)
# breaks every Linux/macOS machine, including the Jenkins agent.
# If you need it on your own Windows laptop, put it in
#   %USERPROFILE%\.gradle\gradle.properties
# which overrides this file only on your machine.
