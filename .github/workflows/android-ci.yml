name: Android CI

# Runs alongside the Jenkins Multibranch Pipeline: same Gradle tasks, hosted on GitHub.
on:
  push:
    branches: [ "main", "develop", "feature/**" ]
  pull_request:
    branches: [ "main", "develop" ]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    name: Unit tests, lint, debug APK
    runs-on: ubuntu-latest
    timeout-minutes: 45

    env:
      # Pull requests skip the Firebase Performance bytecode instrumentation (faster, same tests).
      PERF_INSTRUMENTATION: ${{ github.event_name == 'pull_request' && 'false' || 'true' }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Gradle (cache + wrapper validation)
        uses: gradle/actions/setup-gradle@v4

      - name: Provide google-services.json
        # Repository secret GOOGLE_SERVICES_JSON = the full contents of app/google-services.json.
        # app/build.gradle copies the file named by the GOOGLE_SERVICES_JSON env var into app/.
        env:
          GOOGLE_SERVICES_CONTENT: ${{ secrets.GOOGLE_SERVICES_JSON }}
        run: |
          target="$RUNNER_TEMP/google-services.json"
          if [ -n "$GOOGLE_SERVICES_CONTENT" ]; then
            printf '%s' "$GOOGLE_SERVICES_CONTENT" > "$target"
          else
            echo "::warning::Secret GOOGLE_SERVICES_JSON is not set; using a placeholder config (build and tests only)."
            cat > "$target" <<'EOF'
          {
            "project_info": { "project_number": "000000000000", "project_id": "ci-placeholder" },
            "client": [ {
              "client_info": {
                "mobilesdk_app_id": "1:000000000000:android:0000000000000000",
                "android_client_info": { "package_name": "com.example.ecouganda" }
              },
              "oauth_client": [],
              "api_key": [ { "current_key": "ci-placeholder" } ],
              "services": { "appinvite_service": { "other_platform_oauth_client": [] } }
            } ],
            "configuration_version": "1"
          }
          EOF
          fi
          echo "GOOGLE_SERVICES_JSON=$target" >> "$GITHUB_ENV"

      - name: Make gradlew executable
        run: chmod +x gradlew

      - name: Unit tests
        run: ./gradlew --stacktrace testDebugUnitTest -PfirebasePerformanceInstrumentationEnabled=$PERF_INSTRUMENTATION

      - name: Lint
        run: ./gradlew --stacktrace lintDebug -PfirebasePerformanceInstrumentationEnabled=$PERF_INSTRUMENTATION

      - name: Build debug APK and device-test APK
        run: ./gradlew --stacktrace assembleDebug assembleDebugAndroidTest -PfirebasePerformanceInstrumentationEnabled=$PERF_INSTRUMENTATION

      - name: Upload test and lint reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: reports
          path: |
            app/build/reports/
            app/build/test-results/
          if-no-files-found: ignore

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: app-debug-apk
          path: |
            app/build/outputs/apk/debug/*.apk
            app/build/outputs/apk/androidTest/debug/*.apk
          retention-days: 14

      - name: Remove copied Firebase config
        if: always()
        run: rm -f app/google-services.json "$RUNNER_TEMP/google-services.json"
